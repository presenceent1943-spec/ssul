# assets/cover-urls.txt 에 적힌 AI 생성 커버 이미지를 받아 site/covers/ 에 JPEG(900px)로 저장하고 main에 커밋합니다.
# (작업 환경에서 이미지 CDN 접근이 막혀 있어 GitHub 러너가 대신 받습니다)
name: Fetch cover images
on:
  push:
    paths: ['assets/cover-urls.txt', '.github/workflows/fetch-covers.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          set -e
          mkdir -p site/covers tmp-covers
          while read -r id url; do
            [ -z "$id" ] && continue
            echo "fetch $id"
            curl -sSL --retry 3 -o "tmp-covers/$id.png" "$url"
            convert "tmp-covers/$id.png" -resize 900x900 -strip -interlace Plane -quality 82 "site/covers/$id.jpg"
          done < assets/cover-urls.txt
          ls -la site/covers
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/covers
          git diff --cached --quiet && echo "no change" || git commit -m "커버 이미지 추가 (AI 생성, 자동 변환)"
          git push
