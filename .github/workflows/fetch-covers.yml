# assets/cover-urls.txt 에 적힌 AI 생성 커버 이미지를 받아 site/covers/ 에 JPEG(900px)로 저장하고 main에 커밋합니다.
# (작업 환경에서 이미지 CDN 접근이 막혀 있어 GitHub 러너가 대신 받습니다)
name: Fetch cover images
on:
  push:
    paths: ['assets/cover-urls.txt', '.github/workflows/fetch-covers.yml', 'scripts/fetch_covers.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and convert
        run: |
          pip install --quiet pillow
          python scripts/fetch_covers.py assets/cover-urls.txt site/covers
          ls -la site/covers
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/covers
          git diff --cached --quiet && echo "no change" || git commit -m "커버 이미지 추가 (AI 생성, 자동 변환)"
          git push
