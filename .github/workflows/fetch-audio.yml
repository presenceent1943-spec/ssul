# assets/audio-zip-url.txt 에 적힌 주소(샘플 작품 음성 mp3 + cues.json 묶음 zip)를 받아 site/audio/ 에 풀고 main에 커밋합니다.
# (작업 환경에서 미디어 CDN 접근이 막혀 있어 GitHub 러너가 대신 받습니다)
name: Fetch sample audio
on:
  push:
    paths: ['assets/audio-zip-url.txt', '.github/workflows/fetch-audio.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unzip
        run: |
          url="$(head -n1 assets/audio-zip-url.txt | tr -d '[:space:]')"
          test -n "$url"
          curl -sSfL -A "Mozilla/5.0 (ssul audio fetch)" -o /tmp/audio.zip "$url"
          mkdir -p site/audio
          unzip -o -j /tmp/audio.zip -d site/audio
          ls -la site/audio
          test -f site/audio/cues.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/audio
          git diff --cached --quiet && echo "no change" || git commit -m "샘플 작품 음성 파일 추가 (Seed Audio, 자동 반영)"
          git push
