<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>썰</title>
<meta name="description" content="듣다가, 마음에 들면 구독하는 이야기 앱">
<meta name="application-name" content="썰">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="썰">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff9f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1613">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="fonts/jua.css">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
:root {
    --bg: #fff9f2;
    --surface: #fff;
    --surface-2: #f6eee4;
    --fg: #202020;
    --muted: #6b625a;
    --line: #eadfd3;
    --accent: #c74720;
    --accent-fg: #fff;
    --accent-soft: #fbe7df;
    --accent-deep: #a3391a;
    --paid: #7a5a12;
    --paid-soft: #fbefd0;
    --danger: #b3261e;
    --danger-soft: #f9e2df;
    --good: #2e6b3f;
    --good-soft: #e3f1e6;
    --cover-dark: #2a2320;
    --shadow: 0 10px 30px #3c28141f;
    --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-story: "Gowun Batang", "Apple SD Gothic Neo", "Nanum Myeongjo", serif;
    --radius: 14px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px))
}

@media (prefers-color-scheme:dark) {
    :root:not([data-theme=light]) {
        --bg: #1a1613;
        --surface: #241f1b;
        --surface-2: #2f2823;
        --fg: #f3ede6;
        --muted: #a89c90;
        --line: #3a322c;
        --accent: #f0784f;
        --accent-fg: #1a1613;
        --accent-soft: #4a2a1e;
        --accent-deep: #f6a085;
        --paid: #e6c06a;
        --paid-soft: #3e3418;
        --danger: #f28b82;
        --danger-soft: #4a221f;
        --good: #8cd3a0;
        --good-soft: #1e3a28;
        --cover-dark: #15110f;
        --shadow: 0 10px 30px #00000080;
        --lightningcss-light: ;
        --lightningcss-dark: initial;
        color-scheme: dark
    }
}

:root[data-theme=dark] {
    --bg: #1a1613;
    --surface: #241f1b;
    --surface-2: #2f2823;
    --fg: #f3ede6;
    --muted: #a89c90;
    --line: #3a322c;
    --accent: #f0784f;
    --accent-fg: #1a1613;
    --accent-soft: #4a2a1e;
    --accent-deep: #f6a085;
    --paid: #e6c06a;
    --paid-soft: #3e3418;
    --danger: #f28b82;
    --danger-soft: #4a221f;
    --good: #8cd3a0;
    --good-soft: #1e3a28;
    --cover-dark: #15110f;
    --shadow: 0 10px 30px #00000080;
    --lightningcss-light: ;
    --lightningcss-dark: initial;
    color-scheme: dark
}

* {
    box-sizing: border-box
}

html,
body,
#root {
    height: 100%
}

body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    margin: 0;
    font-size: 16px;
    line-height: 1.55;
    overflow: hidden
}

button,
input,
textarea,
select {
    font: inherit;
    color: inherit
}

button {
    cursor: pointer
}

h1,
h2,
h3,
p,
dl,
dd,
dt,
ol,
ul,
figure {
    margin: 0
}

ol,
ul {
    padding: 0;
    list-style: none
}

code {
    background: var(--surface-2);
    border-radius: 4px;
    padding: 0 4px;
    font-size: .9em
}

:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px
}

@media (prefers-reduced-motion:reduce) {

    *,
    :before,
    :after {
        transition: none !important;
        animation: none !important
    }
}

.app {
    background: var(--bg);
    justify-content: center;
    height: 100%;
    display: flex
}

.app.big-text {
    font-size: 19px
}

.sidenav,
.rail {
    display: none
}

.center {
    background: var(--bg);
    flex-direction: column;
    width: 100%;
    min-width: 0;
    height: 100%;
    display: flex;
    position: relative;
    transform: translateZ(0)
}

@media (min-width:800px) {
    .app {
        gap: 24px;
        padding: 0 24px
    }

    .sidenav {
        flex-direction: column;
        flex: none;
        gap: 6px;
        width: 200px;
        padding-block-start: 20px;
        padding-block-end: 20px;
        display: flex
    }

    .center {
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
        max-width: 680px
    }

    .tabbar {
        display: none
    }
}

@media (min-width:1100px) {
    .rail {
        flex-direction: column;
        flex: none;
        gap: 18px;
        width: 300px;
        padding-block-start: 20px;
        padding-block-end: 20px;
        display: flex;
        overflow-y: auto
    }
}

.easy .btn {
    min-height: 50px
}

.easy .tab span,
.easy .side-item span {
    font-size: 1em
}

.demo-banner {
    background: var(--surface-2);
    color: var(--muted);
    padding: 5px var(--gutter-r) 5px var(--gutter-l);
    text-align: center;
    border-bottom: 1px solid var(--line);
    flex: none;
    font-size: .74rem
}

.content {
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    flex: auto;
    min-height: 0;
    overflow: hidden auto
}

.screen {
    padding-left: var(--gutter-l);
    padding-right: var(--gutter-r);
    flex-direction: column;
    gap: 16px;
    padding-block-start: 8px;
    padding-block-end: 28px;
    display: flex
}

.side-brand {
    align-items: baseline;
    gap: 8px;
    padding: 6px 10px 14px;
    display: flex
}

.side-item {
    color: var(--fg);
    text-align: left;
    background: 0 0;
    border: 0;
    border-radius: 12px;
    align-items: center;
    gap: 12px;
    min-height: 46px;
    padding: 10px 12px;
    font-weight: 500;
    display: flex
}

.side-item:hover {
    background: var(--surface-2)
}

.side-item-on {
    background: var(--surface);
    box-shadow: inset 3px 0 0 var(--accent);
    font-weight: 700
}

.side-create {
    background: var(--accent);
    color: var(--accent-fg);
    justify-content: center;
    margin-top: 8px;
    font-weight: 700
}

.side-create:hover {
    background: var(--accent);
    filter: brightness(1.05)
}

.rail-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    display: flex
}

.rail-title {
    font-size: .95rem;
    font-weight: 700
}

.rail-row {
    text-align: left;
    width: 100%;
    color: var(--fg);
    background: 0 0;
    border: 0;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
    display: flex
}

.rail-row .row-title {
    font-size: .9rem
}

.topbar {
    align-items: center;
    gap: 8px;
    min-height: 52px;
    display: flex
}

.topbar-actions {
    gap: 2px;
    margin-left: auto;
    display: flex
}

.topbar-right {
    justify-content: flex-end;
    align-items: center;
    min-width: 40px;
    margin-left: auto;
    display: flex
}

.page-title {
    letter-spacing: -.01em;
    font-size: 1.3rem;
    font-weight: 700
}

.page-title-center {
    text-align: center;
    flex: 1;
    font-size: 1.05rem
}

.brand {
    align-items: baseline;
    gap: 10px;
    display: flex
}

.brand-mark {
    font-family: var(--font-story);
    color: var(--accent);
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1
}

.brand-mark-big {
    font-size: 3rem
}

.brand-sub {
    color: var(--muted);
    font-size: .85rem
}

.icon-btn {
    min-width: 44px;
    height: 44px;
    color: var(--fg);
    background: 0 0;
    border: 0;
    border-radius: 12px;
    justify-content: center;
    align-items: center;
    gap: 4px;
    padding: 0 6px;
    font-size: .72rem;
    display: inline-flex;
    position: relative
}

.icon-btn:hover {
    background: var(--surface-2)
}

.icon-btn-labeled {
    flex-direction: column;
    gap: 0;
    min-width: 48px;
    line-height: 1.1
}

.dot {
    background: var(--accent);
    border-radius: 50%;
    width: 8px;
    height: 8px;
    position: absolute;
    top: 6px;
    right: 8px
}

.btn {
    white-space: nowrap;
    border: 1px solid #0000;
    border-radius: 12px;
    justify-content: center;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 8px 16px;
    font-weight: 700;
    transition: background .15s, transform 50ms;
    display: inline-flex
}

.btn:active {
    transform: scale(.98)
}

.btn:disabled {
    opacity: .45;
    cursor: not-allowed
}

.btn-sm {
    min-height: 36px;
    padding: 4px 14px;
    font-size: .88rem
}

.btn-lg {
    min-height: 54px;
    padding: 10px 22px;
    font-size: 1.05rem
}

.btn-block {
    width: 100%
}

.btn-primary {
    background: var(--accent);
    color: var(--accent-fg)
}

.btn-primary:hover {
    filter: brightness(1.06)
}

.btn-secondary {
    background: var(--surface);
    border-color: var(--line);
    color: var(--fg)
}

.btn-secondary:hover {
    background: var(--surface-2)
}

.btn-ghost {
    color: var(--accent);
    background: 0 0
}

.btn-danger {
    background: var(--danger-soft);
    color: var(--danger)
}

.btn-warm {
    background: var(--fg);
    color: var(--bg)
}

.btn-row {
    flex-wrap: wrap;
    gap: 8px;
    display: flex
}

.btn-row>.btn-primary {
    flex: 1
}

.link-btn {
    color: var(--accent);
    text-underline-offset: 3px;
    background: 0 0;
    border: 0;
    padding: 0;
    font-weight: 700;
    text-decoration: underline
}

.link-btn.small {
    font-size: .82rem;
    font-weight: 500
}

.chip-row {
    scrollbar-width: none;
    gap: 8px;
    padding-bottom: 2px;
    display: flex;
    overflow-x: auto
}

.chip-row::-webkit-scrollbar {
    display: none
}

.chip-wrap {
    flex-wrap: wrap;
    overflow: visible
}

.chip {
    background: var(--surface);
    border: 1px solid var(--line);
    white-space: nowrap;
    min-height: 38px;
    color: var(--fg);
    border-radius: 999px;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    font-size: .92rem;
    display: inline-flex
}

.chip:hover {
    background: var(--surface-2)
}

.chip-on {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg)
}

.count {
    opacity: .7;
    margin-left: 2px;
    font-size: .78em
}

.badge {
    background: var(--surface-2);
    color: var(--muted);
    white-space: nowrap;
    border-radius: 6px;
    align-items: center;
    padding: 2px 8px;
    font-size: .74rem;
    font-weight: 700;
    display: inline-flex
}

.badge-accent {
    background: var(--accent-soft);
    color: var(--accent-deep)
}

.badge-warm {
    background: var(--paid-soft);
    color: var(--paid)
}

.badge-danger {
    background: var(--danger-soft);
    color: var(--danger)
}

.badge-good {
    background: var(--good-soft);
    color: var(--good)
}

.demo-tag,
.demo-mini {
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 4px;
    margin-left: 4px;
    padding: 0 4px;
    font-size: .7rem
}

.tag-link {
    color: var(--accent);
    background: 0 0;
    border: 0;
    padding: 0;
    font-size: .82rem;
    font-weight: 500
}

.tag-link:hover {
    text-decoration: underline
}

.seg {
    background: var(--surface-2);
    border-radius: 12px;
    align-self: flex-start;
    gap: 2px;
    padding: 3px;
    display: inline-flex
}

.seg button {
    color: var(--muted);
    background: 0 0;
    border: 0;
    border-radius: 10px;
    min-height: 40px;
    padding: 8px 16px;
    font-weight: 700
}

.seg .seg-on {
    background: var(--surface);
    color: var(--fg);
    box-shadow: 0 1px 2px #00000014
}

.seg-small button {
    min-height: 34px;
    padding: 4px 12px;
    font-size: .88rem
}

.seg-wide {
    align-self: stretch
}

.seg-wide button {
    flex: 1
}

.toggle-row {
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    display: flex
}

.toggle-row input {
    opacity: 0;
    width: 1px;
    height: 1px;
    position: absolute
}

.toggle-ui {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    flex: none;
    width: 48px;
    height: 28px;
    transition: background .15s;
    position: relative
}

.toggle-ui:after {
    content: "";
    background: var(--surface);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    transition: transform .15s;
    position: absolute;
    top: 2px;
    left: 2px;
    box-shadow: 0 1px 3px #00000040
}

.toggle-row input:checked~.toggle-ui {
    background: var(--accent);
    border-color: var(--accent)
}

.toggle-row input:checked~.toggle-ui:after {
    transform: translate(20px)
}

.toggle-row input:focus-visible~.toggle-ui {
    outline: 3px solid var(--accent);
    outline-offset: 2px
}

.section-head {
    justify-content: space-between;
    align-items: flex-end;
    gap: 8px;
    margin-top: 4px;
    display: flex
}

.section-title {
    letter-spacing: -.01em;
    text-wrap: balance;
    font-size: 1.08rem;
    font-weight: 700
}

.section-sub {
    color: var(--muted);
    margin-top: 2px;
    font-size: .82rem
}

.muted {
    color: var(--muted)
}

.small {
    font-size: .84rem
}

.center-text {
    text-align: center
}

.label {
    margin-top: 4px;
    font-size: .92rem;
    font-weight: 700
}

.note {
    background: var(--paid-soft);
    color: var(--paid);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: .88rem
}

.warm-text {
    color: var(--paid);
    font-weight: 700
}

.row-between {
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    display: flex
}

.card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    display: flex
}

.card-soft {
    background: var(--surface-2);
    border-color: #0000
}

.card-good {
    background: var(--good-soft);
    border-color: #0000
}

.card-warn {
    background: var(--paid-soft);
    border-color: #0000
}

.menu {
    gap: 2px;
    padding: 6px
}

.menu .btn {
    justify-content: flex-start
}

.list {
    flex-direction: column;
    gap: 8px;
    display: flex
}

.row {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    width: 100%;
    min-height: 60px;
    color: var(--fg);
    border-radius: 12px;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    display: flex
}

.row:hover {
    background: var(--surface-2)
}

.row-plain {
    background: 0 0;
    border: 0;
    flex: 1;
    padding: 0
}

.row-plain:hover {
    background: 0 0
}

.row-text {
    flex-direction: column;
    flex: 1;
    gap: 2px;
    min-width: 0;
    display: flex
}

.row-title {
    text-overflow: ellipsis;
    font-weight: 700;
    overflow: hidden
}

.row-sub {
    color: var(--muted);
    font-size: .84rem
}

.profile-row {
    text-align: left;
    width: 100%;
    color: var(--fg);
    background: 0 0;
    border: 0;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
    display: flex
}

.empty {
    text-align: center;
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 32px 16px;
    display: flex
}

.empty-title {
    font-size: 1.02rem;
    font-weight: 700
}

.empty-desc {
    color: var(--muted);
    max-width: 32ch;
    font-size: .9rem
}

.avatar {
    border-radius: 50%;
    flex: none;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    display: inline-flex
}

.cover {
    border-radius: 12px;
    flex: none;
    justify-content: center;
    align-items: center;
    display: inline-flex;
    position: relative;
    overflow: hidden
}

.cover svg {
    width: 56%;
    height: 56%
}

.cover-label {
    color: #fff;
    background: #00000073;
    border-radius: 6px 0 0;
    padding: 1px 6px;
    font-size: .7rem;
    font-weight: 700;
    position: absolute;
    bottom: 0;
    right: 0
}

.kv {
    grid-template-columns: auto 1fr;
    gap: 8px 14px;
    font-size: .94rem;
    display: grid
}

.kv dt {
    color: var(--muted)
}

.kv-tight {
    gap: 3px 12px;
    font-size: .86rem
}

.field {
    flex-direction: column;
    gap: 6px;
    display: flex
}

.field>span {
    color: var(--muted);
    font-size: .88rem;
    font-weight: 700
}

.field input,
.field textarea,
.comment-input input,
.search-box input,
.big-textarea {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    width: 100%;
    min-height: 46px;
    padding: 11px 14px
}

.field input:focus,
.field textarea:focus,
.big-textarea:focus,
.comment-input input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    outline: none
}

.field-inline {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    gap: 12px
}

.field-inline input {
    text-align: right;
    font-variant-numeric: tabular-nums;
    width: 120px
}

.big-textarea {
    font-family: var(--font-story);
    resize: vertical;
    font-size: 1.08rem;
    line-height: 1.8
}

.check {
    align-items: flex-start;
    gap: 12px;
    padding: 8px 0;
    font-size: .92rem;
    display: flex
}

.check input {
    width: 22px;
    height: 22px;
    accent-color: var(--accent);
    flex: none;
    margin-top: 1px
}

.radio-list {
    flex-direction: column;
    gap: 8px;
    display: flex
}

.radio {
    background: var(--surface);
    border: 1px solid var(--line);
    cursor: pointer;
    border-radius: 12px;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    padding: 12px 14px;
    display: flex
}

.radio-on {
    border-color: var(--accent);
    background: var(--accent-soft)
}

.radio-off {
    opacity: .55
}

.radio input {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    flex: none
}

.radio>span {
    flex: 1
}

.choice-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    display: grid
}

details.section {
    background: var(--surface);
    border: 1px solid var(--line);

    background: var(--surface);
    width: 100%;
    max-height: 82%;
    padding-left: var(--gutter-l);
    padding-right: var(--gutter-r);
    box-shadow: var(--shadow);
    border-radius: 20px 20px 0 0;
    flex-direction: column;
    padding-block-start: 8px;
    padding-block-end: 22px;
    display: flex
}

.sheet-tall {
    max-height: 92%
}

@media (min-width:800px) {
    .sheet-backdrop {
        align-items: center;
        padding: 16px
    }

    .sheet {
        border-radius: 20px;
        max-width: 480px;
        padding-left: 24px;
        padding-right: 24px
    }

    .sheet-handle {
        display: none
    }
}

.sheet-handle {
    background: var(--line);
    border-radius: 2px;
    width: 40px;
    height: 4px;
    margin: 0 auto 8px
}

.sheet-head {
    justify-content: space-between;
    align-items: center;
    display: flex
}

.sheet-head h3 {
    font-size: 1.08rem
}

.sheet-body {
    flex-direction: column;
    gap: 12px;
    padding-top: 6px;
    display: flex;
    overflow-y: auto
}

.sheet-title {
    font-family: var(--font-story);
    font-size: 1.2rem
}

.toast {
    background: var(--fg);
    color: var(--bg);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    text-align: center;
    border-radius: 12px;
    max-width: calc(100% - 32px);
    padding: 12px 18px;
    font-size: .9rem;
    transition: opacity .2s, transform .2s;
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translate(-50%, 20px)
}

.toast-on {
    opacity: 1;
    transform: translate(-50%)
}

.onboard {
    z-index: 60;
    background: var(--bg);
    padding-left: var(--gutter-l);
    padding-right: var(--gutter-r);
    justify-content: center;
    align-items: center;
    padding-block-start: 24px;
    padding-block-end: 24px;
    display: flex;
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    overflow-y: auto
}

.onboard-card {
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 420px;
    display: flex
}

.onboard h1 {
    font-family: var(--font-story);
    text-wrap: balance;
    font-size: 1.6rem;
    line-height: 1.35
}

.shorts {
    scroll-snap-type: y mandatory;
    height: 100%;
    position: relative;
    overflow-y: auto
}

.shorts-back {
    top: 8px;
    left: var(--gutter-l);
    z-index: 2;
    color: #fff;
    background: #00000073;
    margin-bottom: -44px;
    position: sticky
}

.short {
    scroll-snap-align: start;
    scroll-snap-stop: always;
    height: 100%;
    padding: 24px calc(var(--gutter-r) + 72px) 56px var(--gutter-l);
    color: #fff;
    background: var(--cover-dark);
    flex-direction: column;
    justify-content: flex-end;
    display: flex;
    position: relative
}

.short .cover {
    top: 60px;
    left: var(--gutter-l);
    position: absolute
}

.short-body {
    flex-direction: column;
    gap: 10px;
    display: flex
}

.short-cat {
    opacity: .8;
    font-size: .8rem
}

.short-title {
    font-family: var(--font-story);
    font-size: 1.45rem;
    line-height: 1.3
}

.short-lines {
    flex-direction: column;
    gap: 4px;
    max-height: 38vh;
    display: flex;
    overflow: hidden
}

.short-line {
    font-family: var(--font-story);
    opacity: .6;
    font-size: 1.04rem;
    line-height: 1.55;
    transition: opacity .2s
}

.short-line-on {
    opacity: 1;
    font-size: 1.14rem;
    font-weight: 700
}

.short-line-done {
    opacity: .35
}

.short-play {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 999px;
    align-self: flex-start;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    margin-top: 6px;
    padding: 12px 20px;
    font-weight: 700;
    display: inline-flex
}

.short-side {
    right: var(--gutter-r);
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 64px;
    display: flex;
    position: absolute;
    bottom: 56px
}

.short-creator {
    color: #fff;
    text-overflow: ellipsis;
    white-space: nowrap;
    background: #ffffff26;
    border: 0;
    border-radius: 999px;
    max-width: 66px;
    padding: 5px 10px;
    font-size: .8rem;
    font-weight: 700;
    overflow: hidden
}

.side-btn {
    color: #fff;
    background: 0 0;
    border: 0;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-height: 44px;
    font-size: .7rem;
    display: flex
}

.side-on svg {
    fill: currentColor;
    color: var(--accent)
}

.short-hint {
    bottom: 24px;
    left: var(--gutter-l);
    opacity: .65;
    font-size: .74rem;
    position: absolute
}

.short .btn-secondary {
    color: #fff;
    background: #ffffff26;
    border-color: #0000
}


/* ===== 2차 수정: 로고·큰 글씨 커버·격자·더보기·프로필 꾸미기·목소리 ===== */
:root {
  --font-logo: 'Jua', 'Black Han Sans', 'Apple SD Gothic Neo', sans-serif;
}

/* 로고: 말풍선 안의 썰 */
.logo { display: inline-flex; align-items: center; gap: 8px; line-height: 1; }
.logo svg { display: block; width: var(--logo-size); height: var(--logo-size); filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.12)); }
.logo-word { font-family: var(--font-logo); font-size: calc(var(--logo-size) * 0.72); color: var(--accent); letter-spacing: 0.01em; }
.brand-mark { font-family: var(--font-logo); }
.onboard-logo { display: flex; justify-content: center; padding: 8px 0 4px; }
.onboard h1 { font-family: var(--font-logo); font-weight: 400; font-size: 1.75rem; }
.detail-title, .player-title, .short-title, .sheet-title { font-family: var(--font-story); }

/* 커버: 큰 글씨 */
.cover { border-radius: 12px; }
.cover-word { font-family: var(--font-logo); font-weight: 400; line-height: 1; letter-spacing: -0.02em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); display: block; text-align: center; padding: 0 4px; word-break: keep-all; }
.cover-img .cover-word, .cover-img .cover-fill-word { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55), 0 0 2px rgba(0, 0, 0, 0.6); }
.cover-img::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.35)); }
.cover-word { position: relative; }
.cover-preview-row { display: flex; align-items: center; gap: 14px; }
.cover-preview-row p { flex: 1; min-width: 0; }

.cover-fill { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 10%; overflow: hidden; }
.cover-fill-word { position: relative; font-family: var(--font-logo); font-size: clamp(1.3rem, 7vw, 2.2rem); line-height: 1; letter-spacing: -0.02em; text-align: center; padding: 0 8px; word-break: keep-all; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.tile-tall .cover-fill-word { font-size: clamp(1.9rem, 10vw, 3rem); }
@media (min-width: 800px) {
  .cover-fill-word { font-size: 1.9rem; }
  .tile-tall .cover-fill-word { font-size: 2.5rem; }
}

/* 격자 (인스타그램 탐색탭) */
.explore-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: auto; grid-auto-flow: dense; gap: 2px; }
.explore-bleed { margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r)); }
.tile-hit { display: block; width: 100%; min-width: 0; aspect-ratio: 1 / 1; padding: 0; border: 0; background: var(--surface-2); position: relative; overflow: hidden; border-radius: 0; cursor: pointer; }
.explore-grid:not(.explore-bleed) .tile-hit { border-radius: 4px; }
.tile-tall { aspect-ratio: auto; height: 100%; }
.tile-mark { position: absolute; top: 8px; right: 8px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5)); display: inline-flex; }
.tile-name { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; color: #fff; font-size: 0.72rem; font-weight: 600; line-height: 1.2; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.45)); }
.tile-hit:hover .cover-fill { filter: brightness(1.05); }
.big-text .tile-name { font-size: 0.84rem; }
.explore-chips { margin-top: -4px; }
.chip-accent { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
.chip-accent:hover { filter: brightness(1.03); }
.screen-explore { gap: 10px; }
.screen-explore .search-box { background: var(--surface-2); border-color: transparent; }

.view-toggle { align-self: center; }
.view-toggle button { min-height: 32px; padding: 4px 10px; display: inline-flex; align-items: center; }

/* 더보기 */
.more-text { display: block; }
.more-body { display: block; white-space: pre-line; }
.more-clamp { display: -webkit-box; -webkit-line-clamp: var(--lines, 2); -webkit-box-orient: vertical; overflow: hidden; }
.more-btn { background: 0 0; border: 0; padding: 2px 0 0; color: var(--muted); font-size: 0.82rem; font-weight: 700; }
.more-btn:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.work-snippet { color: var(--fg); font-size: 0.9rem; line-height: 1.5; }
.work-snippet .more-body { font-family: var(--font-story); }
.snippet-card .label { margin-top: 0; font-size: 0.82rem; color: var(--muted); }
.script-snippet .more-body { font-family: var(--font-story); font-size: 1.02rem; line-height: 1.8; }
.script-text .more-body { font-family: var(--font-story); font-size: 1.05rem; line-height: 1.9; }

/* 프로필 배너·꾸미기 */
.profile-banner { position: relative; height: 150px; border-radius: 18px; background: var(--surface-2); overflow: hidden; }
.profile-banner-preview { height: 120px; }
.banner-edit { position: absolute; right: 10px; bottom: 10px; background: rgba(0, 0, 0, 0.5); color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.profile-head-banner { margin-top: -48px; }
.profile-head-banner .avatar { border: 4px solid var(--bg); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); }
.profile-row-banner { position: relative; border-radius: 18px; padding: 0; overflow: hidden; min-height: 96px; }
.profile-row-banner .profile-row-inner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; width: 100%; background: linear-gradient(90deg, var(--surface) 0%, color-mix(in oklab, var(--surface) 86%, transparent) 60%, color-mix(in oklab, var(--surface) 20%, transparent) 100%); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 56px; height: 40px; border-radius: 10px; border: 2px solid var(--line); padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; color: var(--fg); font-size: 0.7rem; font-weight: 700; background: var(--surface); }
.swatch-on { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
.swatch-round { width: 36px; height: 36px; border-radius: 50%; }
.swatch-default, .swatch-upload { background: var(--surface-2); }
.radio-voice { flex-wrap: wrap; }
.radio-voice > span { flex: 1; min-width: 120px; }
.radio-voice .btn { margin-left: auto; }
.voice-picker { display: flex; flex-direction: column; gap: 12px; }
.voice-picker input[type='range'] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.field input[type='range'] { border: 0; background: 0 0; padding: 0; }

/* 작은 조정 */
.topbar-actions .icon-btn-labeled { min-width: 44px; }
.brand { align-items: center; }
.side-brand { align-items: center; }
.screen-profile .topbar { position: relative; z-index: 1; }
.stage-video .cover-fill { opacity: 0.55; }
.stage-video .stage-caption-big, .stage-video .stage-caption-next { position: relative; }
.chip svg { vertical-align: -2px; }
@media (max-width: 420px) {
  .row-between .seg button { padding: 8px 12px; }
}

@media (min-width: 800px) {
  .tabbar { display: none; }
}

/* 홈 화면 설치 안내 */
.install { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px var(--gutter-r) 8px var(--gutter-l); background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.install-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.install-text strong { font-size: 0.92rem; }
.install-text .small { color: var(--muted); font-size: 0.78rem; }
.install-x { min-width: 36px; height: 36px; }

</style>

7C \uC62C\uB824\uB2E4\uBCF4\uB2E4\uAC00 \uC724 \uB178\uC778\uC744 \uBC1C\uACAC\uD588\uC2B5\uB2C8\uB2E4. \uB458\uC740 \uD55C\uCC38 \uC11C\uB85C\uB97C \uBC14\uB77C\uBD24\uC2B5\uB2C8\uB2E4. \uC0AC\uC2ED \uB144 \uC804, \uADF8\uB140\uB294 \uC5F4 \uC0B4\uC774\uC5C8\uC2B5\uB2C8\uB2E4. \uC544\uBC84\uC9C0\uC758 \uBC30\uAC00 \uD3ED\uD48D\uC5D0 \uD729\uC4F8\uB838\uB358 \uBC24, \uC724 \uB178\uC778\uC740 \uB4F1\uB300\uC758 \uBD88\uC744 \uBC24\uC0C8 \uBC14\uB2E4\uB85C \uB3CC\uB838\uC2B5\uB2C8\uB2E4. \uADDC\uC815\uC5D0 \uC5C6\uB294 \uC77C\uC774\uC5C8\uC2B5\uB2C8\uB2E4. \uC0C8\uBCBD\uC5D0 \uADF8 \uBD88\uBE5B\uC744 \uB530\uB77C \uBC30 \uD55C \uCC99\uC774 \uB3CC\uC544\uC654\uACE0, \uADF8 \uBC30\uC5D0 \uC18C\uB140\uC758 \uC544\uBC84\uC9C0\uAC00 \uD0C0\uACE0 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uC544\uBC84\uC9C0\uB294 \uB538\uC5D0\uAC8C \uB9D0\uD588\uC2B5\uB2C8\uB2E4. "\uC800 \uBD88\uBE5B\uC774 \uC5C6\uC5C8\uC73C\uBA74 \uBABB \uB3CC\uC544\uC654\uB2E4." \uC18C\uB140\uB294 \uADF8\uB0A0 \uB4F1\uB300\uC5D0 \uC62C\uB77C\uAC00 \uC724 \uB178\uC778\uC5D0\uAC8C \uBB3C\uC5C8\uC2B5\uB2C8\uB2E4. "\uBD88\uBE5B\uC740 \uC5B4\uB5BB\uAC8C \uB9D0\uC744 \uD574\uC694?" \uC724 \uB178\uC778\uC740 \uC190\uC804\uB4F1\uC73C\uB85C \uC2E0\uD638\uB97C \uAC00\uB974\uCCD0 \uC92C\uC2B5\uB2C8\uB2E4. \uC798 \uC788\uB2E4, \uACE0\uB9D9\uB2E4, \uAC08\uAC8C\uC694. \uC18C\uB140\uB294 \uB2E4\uC74C \uD574 \uC721\uC9C0\uB85C \uC774\uC0AC\uD588\uACE0, \uADF8 \uB4A4\uB85C \uB9E4\uB144 \uBD04\uC5D0 \uD3B8\uC9C0\uB97C \uBCF4\uB0C8\uC2B5\uB2C8\uB2E4. \uC774\uB984\uC740 \uC801\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4. \uC724 \uB178\uC778\uC774 \uC790\uC2E0\uC744 \uAE30\uC5B5\uD558\uC9C0 \uBABB\uD560\uAE4C \uBD10, \uAE30\uC5B5\uD558\uC9C0 \uBABB\uD574\uB3C4 \uD3B8\uC9C0\uB294 \uBC1B\uC744 \uC218 \uC788\uAC8C. \uADF8\uB140\uB294 \uC5B4\uB978\uC774 \uB418\uC5B4 \uBC30\uB97C \uD0D4\uC2B5\uB2C8\uB2E4. \uC544\uBC84\uC9C0\uCC98\uB7FC \uC5B4\uBD80\uAC00 \uB418\uC5C8\uACE0, \uB9E4\uB144 \uBD04\uC774\uBA74 \uB4F1\uB300\uAC00 \uBCF4\uC774\uB294 \uBC14\uB2E4\uAE4C\uC9C0 \uB098\uC640 \uBD88\uBE5B\uC744 \uBCF4\uACE0 \uB3CC\uC544\uAC14\uC2B5\uB2C8\uB2E4. \uC62C\uD574 \uB4F1\uB300\uAC00 \uC790\uB3D9\uD654\uB41C\uB2E4\uB294 \uC18C\uC2DD\uC744 \uB4E3\uACE0, \uADF8\uB140\uB294 \uCC98\uC74C\uC73C\uB85C \uC12C\uC5D0 \uC654\uC2B5\uB2C8\uB2E4. "\uC81C\uAC00 \uB204\uAD70\uC9C0 \uC544\uC138\uC694?" \uC724 \uB178\uC778\uC740 \uB300\uB2F5 \uB300\uC2E0 \uC0AC\uC2ED \uD1B5\uC758 \uD3B8\uC9C0\uB97C \uAEBC\uB0C8\uC2B5\uB2C8\uB2E4. \uBD09\uD22C\uB9C8\uB2E4 \uC791\uC740 \uAE00\uC528\uB85C \uB0A0\uC9DC\uAC00 \uC801\uD600 \uC788\uC5C8\uACE0, \uADF8 \uC606\uC5D0 \uC774\uB984\uC774 \uC801\uD600 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uADF8\uB140\uC758 \uC774\uB984\uC774\uC5C8\uC2B5\uB2C8\uB2E4. \uC724 \uB178\uC778\uC740 \uCC98\uC74C\uBD80\uD130 \uC54C\uACE0 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uD55C \uBC88\uB3C4 \uB2F5\uC7A5\uC744 \uBABB \uD55C \uAC74, \uC8FC\uC18C\uAC00 \uC5C6\uC5B4\uC11C\uC600\uC2B5\uB2C8\uB2E4. "\uD3B8\uC9C0\uB294 \uBC1B\uB294 \uC0AC\uB78C\uC774 \uC788\uC73C\uBA74 \uB418\uB294 \uAC70\uB77C\uACE0 \uC0DD\uAC01\uD588\uC18C." \uADF8\uB140\uB294 \uC6B8\uC5C8\uACE0, \uC724 \uB178\uC778\uC740 \uB4F1\uB300 \uC5F4\uC1E0\uB97C \uADF8\uB140\uC5D0\uAC8C \uAC74\uB138\uC2B5\uB2C8\uB2E4. \uC790\uB3D9\uD654\uB41C \uB4F1\uB300\uC5D0\uB3C4 \uC5F4\uC1E0\uB294 \uD558\uB098 \uB0A8\uC544 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uAF2D\uB300\uAE30 \uC804\uB9DD\uC2E4 \uC5F4\uC1E0\uC600\uC2B5\uB2C8\uB2E4. "\uBD04\uC5D0 \uC624\uBA74 \uC5EC\uAE30\uC11C \uBC14\uB2E4\uB97C \uBCF4\uC2DC\uC624. \uBD88\uBE5B\uC740 \uAE30\uACC4\uAC00 \uCF1C\uACA0\uC9C0\uB9CC, \uBCF4\uB294 \uC0AC\uB78C\uC740 \uC788\uC5B4\uC57C \uD558\uB2C8\uAE4C." \uADF8\uD574 \uBD04, \uC12C\uC5D0\uB294 \uD3B8\uC9C0\uAC00 \uC624\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4. \uB300\uC2E0 \uB4F1\uB300 \uAF2D\uB300\uAE30\uC5D0 \uB450 \uC0AC\uB78C\uC774 \uC11C\uC11C \uBC14\uB2E4\uB97C \uBD24\uC2B5\uB2C8\uB2E4. \uBA40\uB9AC\uC11C \uBC30 \uD55C \uCC99\uC774 \uC9C0\uB098\uAC00\uBA70 \uC2E0\uD638\uB97C \uBCF4\uB0C8\uC2
